version: "2"
linters:
  default: standard
  enable:
    - cyclop
    - funlen
    - gocheckcompilerdirectives
    - gocognit
    - goconst
    - gosec
    - intrange
    - lll
    - nestif
    - perfsprint
    - usestdlibvars
    - wastedassign
    - whitespace
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 15
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters: [funlen]
        path: _test\.go
      - linters: [cyclop]
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      - db/orm

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - db/orm
